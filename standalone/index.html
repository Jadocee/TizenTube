<!DOCTYPE html>

<head>
    <style>
        /* --- launch screen ---------------------------------------------------
           Everything here is CSS. The splash runs before the service is up, and
           a script that stalls on this screen leaves the app dead on it, so the
           animation is not allowed to depend on one.

           Only transform and opacity are animated: both composite without
           relaying out the page. There is deliberately no filter: blur() -- a TV
           SoC pays for a full-surface blur every frame, and a handful of blurred
           layers is enough to cost the whole screen its frame rate. The soft
           edge comes from a radial-gradient fill, which rasterises once. */

        .ground {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(120% 90% at 18% 12%, #16233a 0%, transparent 60%),
                radial-gradient(100% 80% at 84% 82%, #1d1430 0%, transparent 62%),
                linear-gradient(160deg, #0d1018 0%, #0f0f0f 55%, #0b0d14 100%);
        }

        .bubbles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%,
                rgb(120 170 255 / 20%) 0%,
                rgb(120 170 255 / 8%) 45%,
                rgb(120 170 255 / 0%) 70%);
            animation: drift linear infinite;
            will-change: transform;
        }

        @keyframes drift {
            /* Fades at both ends, so a bubble is never visible as it wraps. */
            0%   { transform: translate3d(0, 12vh, 0) scale(0.85); opacity: 0; }
            12%  { opacity: 1; }
            88%  { opacity: 1; }
            100% { transform: translate3d(var(--dx, 4vw), -104vh, 0) scale(1.1); opacity: 0; }
        }

        @keyframes rise {
            from { transform: translate3d(0, 1.5rem, 0); opacity: 0; }
            to   { transform: none; opacity: 1; }
        }

        .stage { position: relative; text-align: center; }

        .wordmark {
            color: #FFFFFF;
            font-size: 80px;
            font-family: Roboto, "Noto Sans CJK ZH-HK", "Noto Sans Thai", Arial, Helvetica, sans-serif;
            margin: 0;
            animation: rise 700ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
        }

        /* The numeral carries the accent, so the rebrand reads at ten feet
           without a second line of text. */
        .wordmark .nine { color: #4da3ff; }

        .tagline {
            margin: 0.75rem 0 0;
            color: rgb(255 255 255 / 62%);
            font-size: 22px;
            font-family: Roboto, Arial, Helvetica, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            animation: rise 700ms cubic-bezier(0.2, 0.7, 0.3, 1) 120ms both;
        }

        .progress-container { animation: rise 700ms cubic-bezier(0.2, 0.7, 0.3, 1) 240ms both; }

        /* Motion is a preference, and some sets expose it as an accessibility
           setting. Reduced motion keeps the composition and drops everything
           that moves -- including the progress bar's sweep, which is the most
           restless thing on the screen. */
        @media (prefers-reduced-motion: reduce) {
            .bubble { animation: none; opacity: 0.5; }
            .wordmark, .tagline, .progress-container { animation: none; }
            .progress-bar { animation: none; width: 100%; opacity: 0.5; }
        }

        @keyframes indeterminate-bar {
            0% {
                left: 0%;
                width: 0;
            }

            50% {
                left: 0%;
                width: 100%;
            }

            100% {
                left: 100%;
                width: 0;
            }
        }

        .progress-container {
            position: relative;
            width: 300px;
            height: 4px;
            margin-top: 40px;
            background-color: rgba(25, 118, 210, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #1976D2;
            animation: indeterminate-bar 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
    <script>
        "use strict";

        // Key registration is a nice-to-have; starting the service is not, so it
        // must not sit above it unguarded. registerKey throws InvalidValuesError
        // for any name this model does not list in getSupportedKeys() -- and that
        // set varies by model and region -- so one unsupported key used to abort
        // the whole script, leaving launchAppControl below it never executed and
        // the app dead on the splash with no service at all.
        const keys = [
            "ColorF0Red",
            "ColorF1Green",
            "ColorF2Yellow",
            "ColorF3Blue",
            "MediaPlayPause",
            "MediaPlay",
            "MediaPause",
            "MediaStop",
            "MediaFastForward",
            "MediaRewind",
            "MediaTrackNext",
            "MediaTrackPrevious"
        ];

        for (let i = 0; i < keys.length; i++) {
            try {
                tizen.tvinputdevice.registerKey(keys[i]);
            } catch (e) {
                // Not supported on this model. The others still register.
            }
        }

        // Shown under the progress bar. There is no console on a TV, so a launch
        // that cannot proceed has to say so on screen or it just looks frozen.
        let statusEl = null;
        function status(message) {
            if (!document.body) return;
            if (!statusEl) {
                statusEl = document.createElement("div");
                // position/z-index are load-bearing, not decoration: the gradient
                // ground is position:fixed, so it paints after ordinary in-flow
                // content and would cover this message completely.
                statusEl.style.cssText = "position:relative;z-index:1;color:#aaa;font-family:Roboto,Arial,sans-serif;font-size:22px;margin-top:32px;text-align:center;max-width:80%;";
                // Into the stage, so it sits under the progress bar rather than
                // below the whole centred block.
                (document.querySelector(".stage") || document.body).appendChild(statusEl);
            }
            statusEl.textContent = message;
        }

        const pkgId = tizen.application.getCurrentApplication().appInfo.packageId;

        const serviceId = pkgId + ".StandaloneService";

        // Attempts spent waiting for the service to answer on 8099.
        let attempts = 0;

        function useInjectorOrProxy() {
            // The whole read goes inside the try. getRequestedAppControl()
            // returns null when the app was not started by an app-control
            // request, and that deref used to sit one line ABOVE the try written
            // to tolerate exactly this kind of absence -- so it threw out of the
            // launch callback instead of falling through to the no-args path.
            let args;
            try {
                const requested = tizen.application.getCurrentApplication().getRequestedAppControl();
                const data = requested.appControl.data;
                args = JSON.parse(data[0].value[0]).args;
            } catch (e) {
                // No app-control data: carry on with no args.
            }
            // launchAppControl's success callback means the launch REQUEST was
            // accepted, not that express is listening yet, so the first attempts
            // here are normally connection refusals. The abort deadline matters
            // separately: a service that accepts the connection but never writes
            // a response would otherwise leave this promise pending forever,
            // because fetch has no default timeout.
            const ctrl = new AbortController();
            const deadline = setTimeout(() => ctrl.abort(), 5000);
            fetch('http://localhost:8099/tizentube/getState', { signal: ctrl.signal })
                .then(r => { clearTimeout(deadline); return r.json(); })
                .then(res => {
                    if (res.canConnectToDaemon && !res.isConnecting) {
                        fetch(`http://localhost:8099/tizentube/debugger${args ? `?${args}` : ''}`);
                        tizen.application.getCurrentApplication().exit();
                    } else if (!res.canConnectToDaemon) {
                        location.href = `http://localhost:8099/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8095%2Fdial%2Fapps%2FYouTube${args ? `&${args}` : ''}`
                    } else {
                        // canConnectToDaemon && isConnecting: an attach is already
                        // in flight. This case matched neither branch above, so the
                        // splash sat here forever -- and it is reachable in normal
                        // use, because the debugger branch exits the app and a
                        // relaunch can land here while the previous attach is still
                        // running. Wait for it instead.
                        //
                        // Terminates either way: the service clears isConnecting on
                        // a successful CDP connect, and gives up after ~30s if the
                        // debugger port never comes up. Both outcomes lead to one of
                        // the branches above on a later poll. 500ms matches the
                        // service's own retry cadence.
                        setTimeout(useInjectorOrProxy, 500);
                    }
                }).catch(() => {
                    clearTimeout(deadline);
                    // Retry in place rather than reloading the document. The old
                    // `window.location.reload()` had no delay and no counter, so a
                    // service that took a moment to bind produced a full document
                    // reload loop at connection-refusal speed -- and each reload
                    // re-ran launchAppControl.
                    attempts++;
                    if (attempts === 30) {
                        status("Still waiting for the TizenTube 9 service\u2026");
                    } else if (attempts === 120) {
                        status("The TizenTube 9 service is not responding. Try closing and reopening the app.");
                    }
                    setTimeout(useInjectorOrProxy, 500);
                });
        }

        tizen.application.launchAppControl(
            new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
            serviceId,
            function () {
                useInjectorOrProxy();
            },
            function (e) {
                // alert() on a TV is a dead end with a D-pad; put it on the page.
                status("Could not start the TizenTube 9 service: " + (e && e.message));
            }
        );
    </script>
</head>

<body
    style="background-color: #0f0f0f; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div class="ground"></div>
    <!-- Six, hand-placed. Enough to read as motion, few enough that a TV SoC
         composites them without touching the frame budget. -->
    <div class="bubbles" aria-hidden="true">
        <div class="bubble" style="left:8%;  width:22vh; height:22vh; --dx: 5vw;  animation-duration: 26s; animation-delay: -4s;"></div>
        <div class="bubble" style="left:26%; width:13vh; height:13vh; --dx: -3vw; animation-duration: 19s; animation-delay: -11s;"></div>
        <div class="bubble" style="left:47%; width:30vh; height:30vh; --dx: 4vw;  animation-duration: 34s; animation-delay: -20s;"></div>
        <div class="bubble" style="left:66%; width:16vh; height:16vh; --dx: -6vw; animation-duration: 22s; animation-delay: -2s;"></div>
        <div class="bubble" style="left:81%; width:25vh; height:25vh; --dx: 3vw;  animation-duration: 29s; animation-delay: -15s;"></div>
        <div class="bubble" style="left:93%; width:11vh; height:11vh; --dx: -4vw; animation-duration: 17s; animation-delay: -8s;"></div>
    </div>
    <div class="stage">
        <h1 class="wordmark">TizenTube <span class="nine">9</span></h1>
        <p class="tagline">Starting up</p>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>
</body>

</html>
