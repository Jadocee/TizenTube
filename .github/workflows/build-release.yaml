name: Build TizenTube Standalone and Release

# Runs on every pull request and every push to main, not only on release tags.
# Until now this fired on `v*.*.*` alone, and the repository has no tags -- so
# nothing here had ever executed, and no change had ever been checked by CI. The
# harnesses are the only gate this project has; they need to run before a merge,
# not after a release.
#
# The release half needs the signing secrets and publishes a package, so it is
# gated: .github/scripts/release-gate.sh decides. A tag push always publishes; a
# push to main publishes only when standalone/config.xml's widget version changed
# in that push, since that is the version a television uses for upgrade
# semantics. A pull request builds and verifies everything and stops short of
# signing.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

# A pull request that is pushed to again does not need the superseded run
# finished. Tag and main runs are left alone: those produce artefacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Used only by the release step, which cannot run outside a tag.
      contents: write
      # npm provenance. It makes the published package carry a signed statement
      # of which workflow, commit and repository built it, which is worth having
      # for something people install onto a television. Read-only elsewhere.
      id-token: write
    steps:
      - name: Clone repo with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch full history for tags
          fetch-tags: true

      # Before setup-node, so its `cache: pnpm` can find the binary. The version
      # comes from the root package.json's packageManager field.
      - name: Use pnpm
        uses: pnpm/action-setup@v4

      # Pinned deliberately. Twenty-five harnesses run under
      # --experimental-strip-types, which needs Node 22.6+, and the workflow
      # previously took whatever the runner image happened to ship: on Node 20
      # those twenty-five fail before running a single assertion.
      #
      # registry-url is load-bearing and easy to mistake for decoration. It is
      # what makes setup-node write an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. npm has no
      # knowledge of NODE_AUTH_TOKEN itself -- the name is purely that file's
      # placeholder -- so without this input the publish step below sets an
      # environment variable nothing reads and runs `npm publish`
      # unauthenticated, which fails with ENEEDAUTH however correct the secret
      # is. Verified both ways: with no .npmrc, `NODE_AUTH_TOKEN=x npm whoami`
      # reports ENEEDAUTH; with the file setup-node writes, the same command
      # reaches the registry and reports 401 for a bad token.
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # --frozen-lockfile is the point of the exercise: the install fails rather
      # than silently resolving something new if the lockfile and any manifest
      # have drifted apart. This repository ships a signed package to
      # televisions, where a transitive dependency moving underneath a release
      # is exactly the kind of bug that only reproduces on a device.
      #
      # One command for all four trees, because they are one pnpm workspace now.
      # Before that they were four npm trees whose lockfiles a bare
      # `package-lock.json` rule in .gitignore left half-tracked, so `npm ci`
      # could not have worked here at all.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the typecheck and the harnesses: a formatting or lint failure
      # costs seconds to find here and is the cheapest thing in the run.
      #
      # --error-on-warnings is what makes a Biome gate mean anything: without it
      # Biome exits 0 with a screen full of warnings, which is the same as not
      # running it. The repository is clean at that setting, so anything this
      # step reports is new.
      - name: Lint and check formatting
        run: pnpm exec biome ci --error-on-warnings

      - name: Typecheck
        run: pnpm -r --workspace-concurrency=1 run typecheck

      # Build order is load-bearing: the app's service inlines both the DIAL
      # service and the userscript, so both have to exist before it runs. If
      # either is missing that build exits non-zero rather than quietly
      # producing a package without them.
      - name: Build the DIAL service
        working-directory: service
        run: pnpm run build

      - name: Build the userscript
        working-directory: mods
        run: pnpm run build

      - name: Build the app's service
        working-directory: standalone/service
        run: pnpm run build

      - name: Run the harnesses
        env:
          # A skipped harness is not a passing one. Five harnesses drive a
          # browser and two load the real built bundle; if the Chromium install
          # fails or a bundle is missing, they skip and the run would otherwise
          # go green reporting coverage that never happened.
          TT_STRICT_SKIP: '1'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test

      # A nudge, not a gate. There are two delivery routes with two independent
      # versions, and a PR that changes what one of them ships without moving its
      # version merges to main and publishes nothing. Plenty of PRs legitimately
      # ship nothing -- docs, tests, CI -- so this warns rather than fails.
      #
      # Both halves are checked because warning about one alone leaves the other
      # silent, and until now only the .wgt half existed: a PR could change what
      # TizenBrew installs, leave package.json untouched, and merge with nothing
      # new on the registry to show for it.
      #
      # The routes read different trees. The npm package is dist/userScript.js
      # and dist/service.js, built from mods/ and service/ -- plus package.json
      # itself, which is not only metadata here: TizenBrew reads main,
      # serviceFile, websiteURL and keys straight out of it, so changing one of
      # those changes what runs on a television as surely as editing the
      # userscript does. LICENSE and README.md ride along in the tarball too but
      # change nothing that runs, so they are left out rather than warning on
      # every documentation pull request. The .wgt is mods/, service/ and
      # standalone/, the Tizen app wrapped around them.
      - name: Warn if shipped code changed without a version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base ${BASE_SHA} is not in this checkout; skipping the check"
            exit 0
          fi
          changed() { git diff --name-only "${BASE_SHA}...HEAD" -- "$@" | wc -l; }

          # The TizenBrew module. node rather than a regex, for the same reason
          # .github/scripts/npm-gate.sh uses it: package.json is JSON.
          npm_version() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).version??""))}catch(e){}})'; }
          NPM_CHANGED=$(changed mods service package.json)
          NPM_BEFORE=$(git show "${BASE_SHA}:package.json" 2>/dev/null | npm_version || true)
          NPM_AFTER=$(npm_version < package.json)
          echo "npm: files changed ${NPM_CHANGED}; package version ${NPM_BEFORE:-<absent>} -> ${NPM_AFTER}"
          if [ "${NPM_CHANGED}" -gt 0 ] && [ "${NPM_BEFORE}" = "${NPM_AFTER}" ]; then
            echo "::warning::This PR changes code that ships in the npm package but leaves its version at ${NPM_AFTER}. If ${NPM_AFTER} is already on the registry, merging publishes nothing -- bump version in package.json to cut a TizenBrew release."
          fi

          # The signed .wgt.
          widget_version() { sed -n 's/.*<widget[^>]*version="\([^"]*\)".*/\1/p' | head -n1; }
          WGT_CHANGED=$(changed mods service standalone)
          WGT_BEFORE=$(git show "${BASE_SHA}:standalone/config.xml" 2>/dev/null | widget_version || true)
          WGT_AFTER=$(widget_version < standalone/config.xml)
          echo "wgt: files changed ${WGT_CHANGED}; widget version ${WGT_BEFORE:-<absent>} -> ${WGT_AFTER}"
          if [ "${WGT_CHANGED}" -gt 0 ] && [ "${WGT_BEFORE}" = "${WGT_AFTER}" ]; then
            echo "::warning::This PR changes shipped code but leaves the widget version at ${WGT_AFTER}, so merging it publishes nothing. Bump version= on the <widget> element in standalone/config.xml if this should cut a release."
          fi

      # ---- the TizenBrew module ---------------------------------------------

      # This is the route most people install through: TizenBrew fetches the
      # package from npm and reads main, serviceFile, websiteURL and keys
      # straight out of its package.json. It needs no certificate, which is why
      # it has its own gate rather than riding on the .wgt one -- see
      # .github/scripts/npm-gate.sh for why the two versions are separate.
      #
      # Placed after the harnesses deliberately: an npm version cannot be reused
      # once taken, so nothing reaches the registry that has not passed the
      # suite.
      - name: Decide whether this run publishes to npm
        id: npm
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/npm-gate.sh

      # Same shape as the certificate step below, for the same reason: a
      # repository that has not configured publishing should get a green run
      # rather than a red main every time the version moves. An absent token is
      # a skip; a token that is set but rejected fails loudly at the publish
      # step itself.
      - name: Check the npm token
        id: npm-auth
        if: steps.npm.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
              echo "::warning::NPM_TOKEN is not set, so ${{ steps.npm.outputs.name }}@${{ steps.npm.outputs.version }} was not published. Add it in Settings > Secrets to publish the TizenBrew module."
              echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
              echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      # --dry-run first, so the tarball is inspected before anything is sent.
      # The check is not decoration: main and serviceFile point into dist/, and
      # a package that reached the registry without them would install as a
      # TizenBrew module that loads nothing.
      - name: Verify the package contents
        if: steps.npm.outputs.publish == 'true' && steps.npm-auth.outputs.configured == 'true'
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const [p] = require("/tmp/pack.json");
            const files = p.files.map((f) => f.path);
            const pkg = require("./package.json");
            const required = [pkg.main, pkg.serviceFile, "package.json", "LICENSE"];
            const missing = required.filter((f) => !files.includes(f));
            console.log(`${p.name}@${p.version}: ${p.entryCount} files, ${Math.round(p.size / 1024)} KB packed`);
            for (const f of files) console.log("  " + f);
            if (missing.length) {
              console.error("::error::the tarball is missing " + missing.join(", "));
              process.exit(1);
            }
          '

      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true' && steps.npm-auth.outputs.configured == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # --access public because the package is scoped, and a scoped package
          # defaults to private -- which would publish something nobody can
          # install. --provenance ties the tarball to this workflow run.
          #
          # Captured rather than run bare, because the ways a PRESENT AND VALID
          # token still cannot publish are all account settings -- invisible from
          # inside the run, and indistinguishable from a typo in the secret
          # unless somebody reads npm's error code off the log. The step before
          # this one can only tell whether the secret is empty; everything below
          # is what it cannot see.
          log="$(mktemp)"
          if npm publish --provenance --access public 2>&1 | tee "$log"; then
            exit 0
          fi
          if grep -q 'code EOTP' "$log"; then
            echo "::error::npm asked for a one-time password, so NPM_TOKEN cannot publish unattended. The account requires two-factor authentication for writes, and a token only satisfies that from CI when it is a granular access token created with Bypass 2FA enabled. Regenerate it at npmjs.com with read and write access to this package and Bypass 2FA turned on, then replace the NPM_TOKEN secret; the version is still unpublished, so the next push to main will pick it up with no bump. npm's own recommendation for CI is trusted publishing, which needs no token at all -- but it is configured on an existing package, so it is only an option once a first version has landed."
          elif grep -qE 'code (E401|EAUTHUNKNOWN)' "$log"; then
            echo "::error::npm rejected NPM_TOKEN. The secret is set but not valid for this registry -- check that it has not expired and was copied whole."
          elif grep -q 'code E403' "$log"; then
            echo "::error::npm accepted NPM_TOKEN but refused the publish. Either the token has no write access to this package, or the account behind it does not own the scope in package.json's name."
          elif grep -q 'code E404' "$log"; then
            echo "::error::npm returned 404 for the upload, which does not mean the registry is missing -- for a scoped name it is how npm answers a scope you cannot publish under, reporting a scope somebody else owns exactly like one that does not exist. You can only publish under a scope matching an account or organisation you own. Check package.json's name, or drop the scope: a public unscoped package needs no scope, no organisation and no plan."
          fi
          exit 1

      # ---- the standalone .wgt ------------------------------------------------

      # The logic lives in a script rather than inline here so it can be tested:
      # test/release-gate drives it through a bump, an unchanged version, an
      # existing tag, a tag push, a pull request and a new branch, against real
      # git history. This runs with the signing certificate available and can
      # create a tag people download a package from, so it is the last place in
      # the repository that should be untested -- and until now the whole release
      # path had never executed once.
      - name: Decide whether this run publishes
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/release-gate.sh

      # Also decides whether this repository signs at all. Publishing a .wgt is
      # opt-in: the TizenBrew module route needs no certificate, so a repository
      # that only ships that way emits signed=false here and the three steps
      # below skip -- rather than turning main red on every version bump. A
      # secret that is set but unusable still fails, loudly, at this step.
      #
      # In a script so it can be tested, and because of how it failed the first
      # time it ran: neither secret was set, so this wrote a ZERO-BYTE .p12,
      # exited 0, and the packager reported "Too few bytes to parse DER" half a
      # minute later. test/release-gate/cert.test.mjs covers that case and the
      # rest, including a real generated certificate.
      - name: Prepare Tizen Certificate
        id: cert
        if: steps.gate.outputs.release == 'true'
        env:
          TIZEN_AUTHOR_KEY: ${{ secrets.TIZEN_AUTHOR_KEY }}
          TIZEN_AUTHOR_KEY_PW: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
          CERT_PATH: ${{ github.workspace }}/TizenTube-author.p12
        run: bash .github/scripts/prepare-certificate.sh

      - name: Build TizenTube
        if: steps.gate.outputs.release == 'true' && steps.cert.outputs.signed == 'true'
        working-directory: standalone
        run: |
          # npm deliberately: a global CLI, not a workspace dependency.
          npm install -g https://github.com/reisxd/tizen.js/tarball/main
          # Dropped before packaging as well as ignored below: the app ships the
          # built bundle, and there is no reason for a dependency tree to be
          # anywhere near the .wgt.
          rm -rf service/node_modules
          mkdir release
          tizenjs build . -t wgt -o release/TizenTube.wgt --author "${GITHUB_WORKSPACE}/TizenTube-author.p12" --authorPwd '${{ secrets.TIZEN_AUTHOR_KEY_PW }}' -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      - name: Upload TizenTube package artifact
        if: steps.gate.outputs.release == 'true' && steps.cert.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
            name: app-${{ github.sha }}.wgt
            path: standalone/release/TizenTube.wgt

      - name: Release TizenTube Build Results
        if: steps.gate.outputs.release == 'true' && steps.cert.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            standalone/release/*
