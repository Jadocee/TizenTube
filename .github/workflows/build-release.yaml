name: Build TizenTube Standalone and Release

# Runs on every pull request and every push to main, not only on release tags.
# Until now this fired on `v*.*.*` alone, and the repository has no tags -- so
# nothing here had ever executed, and no change had ever been checked by CI. The
# harnesses are the only gate this project has; they need to run before a merge,
# not after a release.
#
# The release half needs the signing secrets and publishes a package, so it is
# gated: .github/scripts/release-gate.sh decides. A tag push always publishes; a
# push to main publishes only when standalone/config.xml's widget version changed
# in that push, since that is the version a television uses for upgrade
# semantics. A pull request builds and verifies everything and stops short of
# signing.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

# A pull request that is pushed to again does not need the superseded run
# finished. Tag and main runs are left alone: those produce artefacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Used only by the release step, which cannot run outside a tag.
      contents: write
    steps:
      - name: Clone repo with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch full history for tags
          fetch-tags: true

      # Before setup-node, so its `cache: pnpm` can find the binary. The version
      # comes from the root package.json's packageManager field.
      - name: Use pnpm
        uses: pnpm/action-setup@v4

      # Pinned deliberately. Seven harnesses run under
      # --experimental-strip-types, which needs Node 22.6+, and the workflow
      # previously took whatever the runner image happened to ship: on Node 20
      # those seven fail before running a single assertion.
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # --frozen-lockfile is the point of the exercise: the install fails rather
      # than silently resolving something new if the lockfile and any manifest
      # have drifted apart. This repository ships a signed package to
      # televisions, where a transitive dependency moving underneath a release
      # is exactly the kind of bug that only reproduces on a device.
      #
      # One command for all four trees, because they are one pnpm workspace now.
      # Before that they were four npm trees whose lockfiles a bare
      # `package-lock.json` rule in .gitignore left half-tracked, so `npm ci`
      # could not have worked here at all.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --workspace-concurrency=1 run typecheck

      # Build order is load-bearing: the app's service inlines both the DIAL
      # service and the userscript, so both have to exist before it runs. If
      # either is missing that build exits non-zero rather than quietly
      # producing a package without them.
      - name: Build the DIAL service
        working-directory: service
        run: pnpm run build

      - name: Build the userscript
        working-directory: mods
        run: pnpm run build

      - name: Build the app's service
        working-directory: standalone/service
        run: pnpm run build

      - name: Run the harnesses
        env:
          # A skipped harness is not a passing one. Four of them drive a browser
          # and two load the real built bundle; if the Chromium install fails or
          # a bundle is missing, they skip and the run would otherwise go green
          # reporting coverage that never happened.
          TT_STRICT_SKIP: '1'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test

      # A nudge, not a gate. Merging a PR that changes what ships without
      # bumping the widget version publishes nothing, and the .wgt it would
      # eventually produce does not read as an upgrade on a television. Plenty
      # of PRs legitimately ship nothing -- docs, tests, CI -- so this warns
      # rather than fails.
      - name: Warn if shipped code changed without a version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          widget_version() { sed -n 's/.*<widget[^>]*version="\([^"]*\)".*/\1/p' | head -n1; }
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base ${BASE_SHA} is not in this checkout; skipping the check"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${BASE_SHA}...HEAD" -- mods service standalone | wc -l)
          BEFORE=$(git show "${BASE_SHA}:standalone/config.xml" 2>/dev/null | widget_version || true)
          AFTER=$(widget_version < standalone/config.xml)
          echo "shipped files changed: ${CHANGED}; widget version ${BEFORE:-<absent>} -> ${AFTER}"
          if [ "${CHANGED}" -gt 0 ] && [ "${BEFORE}" = "${AFTER}" ]; then
            echo "::warning::This PR changes shipped code but leaves the widget version at ${AFTER}, so merging it publishes nothing. Bump version= on the <widget> element in standalone/config.xml if this should cut a release."
          fi

      # ---- publishing --------------------------------------------------------

      # The logic lives in a script rather than inline here so it can be tested:
      # test/release-gate drives it through a bump, an unchanged version, an
      # existing tag, a tag push, a pull request and a new branch, against real
      # git history. This runs with the signing certificate available and can
      # create a tag people download a package from, so it is the last place in
      # the repository that should be untested -- and until now the whole release
      # path had never executed once.
      - name: Decide whether this run publishes
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/release-gate.sh

      # In a script so it can be tested, and because of how it failed the first
      # time it ran: neither secret was set, so this wrote a ZERO-BYTE .p12,
      # exited 0, and the packager reported "Too few bytes to parse DER" half a
      # minute later. test/release-gate/cert.test.mjs covers that case and the
      # rest, including a real generated certificate.
      - name: Prepare Tizen Certificate
        if: steps.gate.outputs.release == 'true'
        env:
          TIZEN_AUTHOR_KEY: ${{ secrets.TIZEN_AUTHOR_KEY }}
          TIZEN_AUTHOR_KEY_PW: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
          CERT_PATH: ${{ github.workspace }}/TizenTube-author.p12
        run: bash .github/scripts/prepare-certificate.sh

      - name: Build TizenTube
        if: steps.gate.outputs.release == 'true'
        working-directory: standalone
        run: |
          # npm deliberately: a global CLI, not a workspace dependency.
          npm install -g https://github.com/reisxd/tizen.js/tarball/main
          # Dropped before packaging as well as ignored below: the app ships the
          # built bundle, and there is no reason for a dependency tree to be
          # anywhere near the .wgt.
          rm -rf service/node_modules
          mkdir release
          tizenjs build . -t wgt -o release/TizenTube.wgt --author "${GITHUB_WORKSPACE}/TizenTube-author.p12" --authorPwd '${{ secrets.TIZEN_AUTHOR_KEY_PW }}' -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      - name: Upload TizenTube package artifact
        if: steps.gate.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
            name: app-${{ github.sha }}.wgt
            path: standalone/release/TizenTube.wgt

      - name: Release TizenTube Build Results
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            standalone/release/*
